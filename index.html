<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Dolly's Playroom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Grandstander:wght@500;700;800&display=swap">
<style>
/* Layout: a die-cut sticker monster stands in its room on the left; a butter-yellow wardrobe of live previews fills the right. */
:root {
  --closet: #0d6c66;
  --closet-deep: #0a5752;
  --drawer: #ffd84d;
  --drawer-deep: #f4bb1f;
  --paper: #fffdf4;
  --ink: #2a1a4a;
  --pop: #ff4f8b;
  --spook: #6b3fd4;
  --display: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Grandstander", "Trebuchet MS", "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--closet);
  background-image: radial-gradient(var(--closet-deep) 14%, transparent 15%);
  background-size: 26px 26px;
  color: var(--ink);
  font-family: var(--body);
  font-weight: 700;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--pop); outline-offset: 2px; }

.app {
  height: 100%;
  min-height: 620px;
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
  gap: 16px;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1280px;
  margin-inline: auto;
}
.left, .right { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 10px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 {
  margin: 0;
  font: 400 clamp(24px, 3.4vw, 40px)/1 var(--display);
  color: var(--drawer);
  text-shadow: 3px 3px 0 var(--ink);
  letter-spacing: .01em;
  text-wrap: balance;
}
.sound {
  flex: none; background: var(--paper); border: 3px solid var(--ink); border-radius: 999px;
  padding: 5px 14px 3px; font-size: 14px; box-shadow: 2px 3px 0 var(--ink);
}

.stage {
  position: relative; flex: 1; min-height: 0; overflow: hidden;
  border: 4px solid var(--ink); border-radius: 26px; box-shadow: 4px 6px 0 var(--ink);
  background: var(--ink);
}
.room, .monster { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.monster { padding: 6px; overflow: visible; }
#critter { cursor: pointer; transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 3.2s ease-in-out infinite; }
#critter.hop { animation: hop .5s ease; }
#critter.tickle { animation: tickle .7s ease; }
@keyframes breathe { 50% { transform: scale(1.012, .985); } }
@keyframes hop {
  0% { transform: scale(1.1, .88); } 40% { transform: translateY(-34px) scale(.95, 1.06); }
  75% { transform: scale(1.08, .9); } 100% { transform: none; }
}
@keyframes tickle {
  0%, 100% { transform: none; } 20% { transform: rotate(-5deg); } 40% { transform: rotate(5deg); }
  60% { transform: rotate(-4deg); } 80% { transform: rotate(3deg); }
}
.lid { transform-box: fill-box; transform-origin: 50% 0; transform: scaleY(0); animation: blink 5.3s infinite; }
.thumb .lid { animation: none; }
@keyframes blink { 0%, 95%, 100% { transform: scaleY(0); } 97.5% { transform: scaleY(1); } }

.bubble {
  position: absolute; top: 12px; left: 12px; max-width: 46%;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 18px 18px 18px 4px;
  padding: 7px 14px 4px; font: 400 clamp(16px, 2vw, 21px)/1.15 var(--display);
  box-shadow: 2px 3px 0 var(--ink);
}
.heart { position: absolute; font-size: 24px; color: var(--pop); pointer-events: none; animation: float 1s ease-out forwards; }
@keyframes float { to { transform: translateY(-90px) rotate(18deg); opacity: 0; } }

.card {
  background: var(--paper); border: 4px solid var(--ink); border-radius: 16px;
  padding: 8px 12px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 4px 16px; align-items: center;
  box-shadow: 4px 5px 0 var(--ink);
}
.card-name { display: flex; align-items: center; gap: 6px; min-width: 0; }
.eyebrow { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--pop); font-weight: 800; }
#name {
  width: 100%; min-width: 0; border: 0; border-bottom: 3px dashed var(--ink); background: none;
  font: 400 22px/1.1 var(--display); padding: 2px 0 0;
}
.reroll { flex: none; background: var(--drawer); border: 3px solid var(--ink); border-radius: 10px; padding: 4px 8px 1px; font-size: 13px; }
.facts { grid-column: 1 / -1; margin: 0; font-size: 14px; font-weight: 500; line-height: 1.3; }
.meter-row { display: flex; justify-content: space-between; font-size: 13px; }
.meter { position: relative; height: 14px; border: 3px solid var(--ink); border-radius: 99px; background: linear-gradient(90deg, #ffb3cf, #cdb7ff, var(--spook)); margin-top: 2px; }
#pin { position: absolute; top: -6px; width: 16px; height: 20px; margin-left: -8px; background: var(--paper); border: 3px solid var(--ink); border-radius: 7px; transition: left .3s ease; }
#verdict { font-size: 14px; text-align: center; margin-top: 3px; }

.wardrobe {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  background: var(--drawer); border: 4px solid var(--ink); border-radius: 26px; box-shadow: 4px 6px 0 var(--ink); overflow: hidden;
}
.tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; padding: 10px 10px 8px; background: var(--drawer-deep); border-bottom: 4px solid var(--ink); }
.tab { border: 3px solid var(--ink); border-radius: 11px; background: var(--paper); padding: 6px 2px 3px; font-size: 14px; }
.tab[aria-selected="true"] { background: var(--pop); color: var(--paper); }
.shelf { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.shelf h2 { margin: 2px 0 0; font: 400 19px/1 var(--display); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 9px; }
.tile {
  display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 4px 4px 3px; min-width: 0;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 15px; font-size: 13px; line-height: 1.1;
  transition: transform .1s;
}
.tile:hover { transform: translateY(-2px) rotate(-1deg); }
.tile[aria-pressed="true"] { background: #ffd3e3; box-shadow: 0 0 0 3px var(--pop); }
.thumb { width: 100%; aspect-ratio: 1; display: block; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--ink); background: var(--c); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--paper), 0 0 0 6px var(--pop); }
.actions { display: flex; gap: 8px; padding: 9px 10px; background: var(--drawer-deep); border-top: 4px solid var(--ink); }
.actions button { flex: 1; border: 3px solid var(--ink); border-radius: 13px; padding: 9px 6px 6px; font: 400 17px/1 var(--display); box-shadow: 2px 3px 0 var(--ink); }
#surprise { background: var(--pop); color: var(--paper); }
#reset { background: var(--paper); }
.actions button:active, .sound:active { transform: translate(2px, 2px); box-shadow: none; }

.head-btns { flex: none; display: flex; gap: 8px; }
a.sound { color: var(--ink); text-decoration: none; font-size: 14px; }

.home {
  min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: clamp(14px, 3vh, 26px); text-align: center;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.home-title {
  margin: 0; font: 400 clamp(32px, 6.5vw, 62px)/1.05 var(--display); color: var(--drawer);
  text-shadow: 3px 4px 0 var(--ink); text-wrap: balance;
}
.home-title span { color: #ffb3cf; }
.doors {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr) minmax(0, 1fr); align-items: end;
  gap: clamp(32px, 4vw, 48px); width: min(100%, 104vh, 980px);
}
.door.soon {
  background: repeating-linear-gradient(90deg, var(--c) 0 26px, var(--c2) 26px 30px);
  box-shadow: 0 0 0 8px var(--drawer), 0 0 0 12px var(--ink), 6px 9px 0 12px var(--ink);
}
.door.soon:hover { transform: none; }
.door.soon::after {
  content: ""; position: absolute; right: 12%; top: 54%; width: 22px; height: 22px; border-radius: 50%;
  background: var(--drawer); border: 4px solid var(--ink);
}
.door.soon .door-label { background: var(--paper); color: var(--ink); font-size: 19px; padding: 7px 16px 3px; bottom: -20px; }
.door {
  position: relative; display: block; width: 100%; aspect-ratio: 5 / 6;
  background:
    radial-gradient(circle at 18% 30%, #fffdf4 0 3px, transparent 4px),
    radial-gradient(circle at 80% 22%, #fffdf4 0 4px, transparent 5px),
    radial-gradient(circle at 30% 14%, #fffdf4 0 2px, transparent 3px),
    radial-gradient(circle at 62% 8%, #fffdf4 0 3px, transparent 4px),
    radial-gradient(circle at 90% 46%, #fffdf4 0 2px, transparent 3px),
    radial-gradient(circle at 8% 52%, #fffdf4 0 3px, transparent 4px),
    linear-gradient(#1a1d5a 0 74%, #c9c6dd 74%);
  border: 5px solid var(--ink); border-radius: 999px 999px 30px 30px; box-shadow: 0 0 0 12px var(--drawer), 0 0 0 16px var(--ink), 8px 12px 0 16px var(--ink);
  color: var(--ink); text-decoration: none; margin-block: 16px;
  transition: transform .12s;
}
.door:hover { transform: scale(1.02) rotate(-1deg); }
.home-monster { position: absolute; left: 5%; right: 5%; bottom: 5%; width: 90%; height: auto; overflow: visible; }
#home-critter { transform-box: fill-box; transform-origin: 50% 100%; animation: wave 1.8s ease-in-out infinite; }
#home-critter.hop { animation: hop .5s ease; }
@keyframes wave { 0%, 100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg) translateY(-6px); } }
.door-bubble {
  position: absolute; top: 15%; right: -3%; background: var(--paper); border: 3px solid var(--ink); border-radius: 18px 18px 4px 18px;
  padding: 6px 12px 3px; font: 400 20px/1.1 var(--display); box-shadow: 2px 3px 0 var(--ink);
}
.door-label {
  position: absolute; left: 50%; bottom: -24px; transform: translateX(-50%);
  background: var(--pop); color: var(--paper); border: 4px solid var(--ink); border-radius: 18px;
  padding: 9px 18px 5px; font: 400 clamp(19px, 2.3vw, 26px)/1 var(--display); box-shadow: 3px 4px 0 var(--ink); white-space: nowrap;
}

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 47fr) minmax(0, 53fr); padding-block: 8px; gap: 12px; min-height: 680px; }
  .left { gap: 7px; }
  .doors { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); width: min(100%, 340px); }
  .door.main { grid-column: 1 / -1; grid-row: 1; width: 86%; margin-inline: auto; }
  .facts { display: none; }
  .card { padding: 5px 9px; }
  #name { font-size: 18px; }
  .eyebrow, #verdict, .wide { display: none; }
  .card { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 4px 10px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(82px, 1fr)); }
  .tab { font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  #critter, #critter.hop, #critter.tickle, #home-critter, #home-critter.hop, .lid, .heart { animation: none; }
  .tile, #pin { transition: none; }
}
</style>

</head>
<body>
<section class="home" id="home" aria-label="Home">
  <h2 class="home-title"><span>Dolly's</span> Playroom</h2>
  <!-- To add a game: turn a .soon door into a link like #door, with its own hash. -->
  <div class="doors">
  <div class="door soon" style="--c:#7cc8ff;--c2:#64b6f2" aria-label="A new game is coming soon" role="img"><span class="door-label">Soon!</span></div>
  <a class="door main" id="door" href="#closet" aria-label="Play Baby Monster Closet">
    <span class="door-bubble" aria-hidden="true">Gaa!</span>
    <svg class="home-monster" viewBox="-30 -40 460 470" aria-hidden="true">
      <defs>
        <filter id="sticker-home" x="-15%" y="-15%" width="130%" height="130%">
          <feMorphology in="SourceAlpha" operator="dilate" radius="6" result="fat"/>
          <feFlood flood-color="#fffdf4"/>
          <feComposite in2="fat" operator="in" result="edge"/>
          <feMerge><feMergeNode in="edge"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g filter="url(#sticker-home)"><g id="home-critter"></g></g>
    </svg>
    <span class="door-label">Baby Monster Closet</span>
  </a>
  <div class="door soon" style="--c:#7fe3c0;--c2:#68d4af" aria-label="A new game is coming soon" role="img"><span class="door-label">Soon!</span></div>
  </div>
</section>

<main class="app" id="app" hidden>
  <section class="left" aria-label="Your monster">
    <header>
      <h1>Dolly's Baby Monster Closet</h1>
      <div class="head-btns">
        <a class="sound" href="#home" id="back">Home</a>
        <button class="sound" id="sound" type="button" aria-pressed="true">Sound on</button>
      </div>
    </header>
    <div class="stage" id="stage">
      <svg class="room" id="room" viewBox="0 0 800 500" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
      <svg class="monster" id="monster" viewBox="-30 -40 460 470" role="img" aria-label="Your baby monster. Tap to tickle.">
        <defs>
          <filter id="sticker" x="-15%" y="-15%" width="130%" height="130%">
            <feMorphology in="SourceAlpha" operator="dilate" radius="6" result="fat"/>
            <feFlood flood-color="#fffdf4"/>
            <feComposite in2="fat" operator="in" result="edge"/>
            <feOffset in="fat" dx="4" dy="6" result="drop"/>
            <feFlood flood-color="#2a1a4a" flood-opacity=".3"/>
            <feComposite in2="drop" operator="in" result="shade"/>
            <feMerge><feMergeNode in="shade"/><feMergeNode in="edge"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <g filter="url(#sticker)"><g id="critter"></g></g>
      </svg>
      <div class="bubble" id="bubble" aria-live="polite">Gaa!</div>
    </div>
    <div class="card">
      <div>
        <div class="eyebrow">It's a monster!</div>
        <div class="card-name">
          <input id="name" aria-label="Monster name" maxlength="18" autocomplete="off">
          <button class="reroll" id="rename" type="button" aria-label="New name">New<span class="wide"> name</span></button>
        </div>
      </div>
      <div>
        <div class="meter-row"><span>Snuggly</span><span>Spooky</span></div>
        <div class="meter" aria-hidden="true"><div id="pin"></div></div>
        <div id="verdict"></div>
      </div>
      <p class="facts" id="facts"></p>
    </div>
  </section>

  <section class="right" aria-label="Wardrobe">
    <div class="wardrobe">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="shelf" id="shelf"></div>
      <div class="actions">
        <button id="surprise" type="button">Surprise me</button>
        <button id="reset" type="button">Undress</button>
      </div>
    </div>
  </section>
</main>

<script>
(() => {
const INK = '#2a1a4a', PAPER = '#fffdf4';
const S = `stroke="${INK}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"`;
const THIN = `stroke="${INK}" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"`;
const LINE = `fill="none" ${S}`;

/* ---------- Bodies ---------- */
function tuftPath() {
  let d = '';
  for (let i = 0; i < 44; i++) {
    const a = i / 44 * Math.PI * 2 - Math.PI / 2, r = i % 2 ? 133 : 151;
    d += (i ? 'L' : 'M') + (200 + Math.cos(a) * r * 1.02).toFixed(1) + ' ' + (238 + Math.sin(a) * r).toFixed(1);
  }
  return d + 'Z';
}
const BODIES = {
  gloop: { label: 'Gloop', d: 'M200 96C276 96 306 170 322 262C336 344 302 386 200 386C98 386 64 344 78 262C94 170 124 96 200 96Z',
    top: 96, eye: 186, gap: 50, mouth: 244, neck: 272, hem: 386, hw: 124, arm: 84, armY: 292, foot: 62, hx: 48, hy: 124 },
  tuft: { label: 'Tuft', d: tuftPath(),
    top: 88, eye: 200, gap: 54, mouth: 258, neck: 290, hem: 389, hw: 122, arm: 62, armY: 280, foot: 58, hx: 74, hy: 120 },
  noodle: { label: 'Noodle', d: 'M200 58C262 58 282 110 282 180L287 320C289 372 254 386 200 386C146 386 111 372 113 320L118 180C118 110 138 58 200 58Z',
    top: 58, eye: 146, gap: 40, mouth: 204, neck: 236, hem: 386, hw: 90, arm: 116, armY: 270, foot: 52, hx: 44, hy: 84 },
  chunk: { label: 'Chunk', d: 'M120 110Q200 90 280 110Q326 120 326 176L330 330Q330 384 276 386L124 386Q70 384 70 330L74 176Q74 120 120 110Z',
    top: 100, eye: 188, gap: 58, mouth: 246, neck: 274, hem: 386, hw: 130, arm: 72, armY: 296, foot: 72, hx: 74, hy: 120 },
  drip: { label: 'Drip', d: 'M200 84C280 84 318 150 318 230L322 356Q300 400 272 362Q248 400 224 362Q200 400 176 362Q152 400 128 362Q100 400 78 356L82 230C82 150 120 84 200 84Z',
    top: 84, eye: 178, gap: 50, mouth: 236, neck: 266, hem: 372, hw: 120, arm: 82, armY: 286, foot: 74, hx: 56, hy: 112 },
};
const FURS = ['#7fe3c0', '#ff9ec7', '#b49bff', '#7cc8ff', '#ff9d4d', '#ffe066', '#ff6b5e', '#a6d94e', '#e8e0f5', '#5a6fd6'];
const FUR_NAMES = ['Mint', 'Bubblegum', 'Grape', 'Sky', 'Tangerine', 'Lemon', 'Tomato', 'Slime', 'Fog', 'Midnight'];

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const c = [n >> 16, n >> 8 & 255, n & 255].map(v => Math.round(f < 0 ? v * (1 + f) : v + (255 - v) * f));
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
}

/* ---------- Items. "s" nudges the snuggly/spooky meter. ---------- */
const PATTERNS = [
  { id: 'none', label: 'Plain', s: 0, draw: () => '' },
  { id: 'belly', label: 'Tummy', s: -1, draw: (b, c) => `<ellipse cx="200" cy="${b.neck + 40}" rx="${b.hw * .72}" ry="82" fill="${shade(c, .55)}"/>` },
  { id: 'spots', label: 'Spots', s: 0, draw: (b, c) => [[120, 150, 22], [286, 200, 28], [108, 290, 26], [270, 330, 20], [200, 345, 15], [300, 110, 16], [150, 95, 13]].map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="${p[2]}" fill="${shade(c, -.18)}"/>`).join('') },
  { id: 'stripes', label: 'Tiger', s: 1, draw: (b, c) => [120, 170, 220, 270, 320, 370].map(y => `<path d="M40 ${y}l62 16-62 16zM360 ${y}l-62 16 62 16z" fill="${shade(c, -.28)}"/>`).join('') },
  { id: 'stars', label: 'Freckles', s: -1, draw: (b, c) => { let o = ''; for (let i = 0; i < 26; i++) o += `<circle cx="${70 + (i * 83) % 260}" cy="${80 + (i * 47) % 300}" r="5" fill="${shade(c, .6)}"/>`; return o; } },
];

function eyeball(x, y, r, look = 0, shine = true) {
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" ${S}/>
  <circle cx="${x + look}" cy="${y + r * .12}" r="${r * .62}" fill="${INK}"/>
  ${shine ? `<circle cx="${x + look + r * .22}" cy="${y - r * .14}" r="${r * .24}" fill="#fff"/><circle cx="${x + look - r * .2}" cy="${y + r * .32}" r="${r * .11}" fill="#fff"/>` : ''}`;
}
const lid = (x, y, r, c) => `<ellipse class="lid" cx="${x}" cy="${y}" rx="${r + 2}" ry="${r + 2}" fill="${shade(c, -.1)}"/>`;
const EYES = [
  { id: 'big', label: 'Big', s: -2, draw: (b, c) => [-1, 1].map(k => eyeball(200 + k * b.gap, b.eye, 34) + lid(200 + k * b.gap, b.eye, 34, c)).join('') },
  { id: 'cyclops', label: 'One eye', s: 1, draw: (b, c) => eyeball(200, b.eye, 54) + lid(200, b.eye, 54, c) },
  { id: 'three', label: 'Three', s: 2, draw: (b, c) => [[-1, 12], [1, 12], [0, -30]].map(p => eyeball(200 + p[0] * (b.gap + 8), b.eye + p[1], 25) + lid(200 + p[0] * (b.gap + 8), b.eye + p[1], 25, c)).join('') },

  { id: 'bed', label: 'Under the bed', s: 2, wall: '#2b2147', draw: () => `<rect width="800" height="500" fill="#2b2147"/><rect y="340" width="800" height="160" fill="#463768"/><path d="M0 340H800" stroke="#14102a" stroke-width="6"/>${[0, 100, 200, 300, 400, 500, 600, 700].map(x => `<rect x="${x + 6}" y="0" width="88" height="48" fill="#6a4630" stroke="#14102a" stroke-width="5"/>`).join('')}${[[80, 170], [150, 240], [690, 150], [620, 250], [720, 270]].map(p => `<ellipse cx="${p[0]}" cy="${p[1]}" rx="11" ry="15" fill="#ffe066"/><ellipse cx="${p[0] + 32}" cy="${p[1]}" rx="11" ry="15" fill="#ffe066"/><circle cx="${p[0] + 3}" cy="${p[1]}" r="4" fill="#14102a"/><circle cx="${p[0] + 35}" cy="${p[1]}" r="4" fill="#14102a"/>`).join('')}<path d="M110 440q40 -60 80 -10q26 -8 34 16q-60 20 -114 -6Z" fill="#8a7ca8" stroke="#14102a" stroke-width="5"/><path d="M640 410h40v30q40 0 40 26h-80Z" fill="#ff6b5e" stroke="#14102a" stroke-width="5"/>` },
  { id: 'closet', label: 'Closet', s: 0, wall: '#ffe9a8', draw: () => { const g = [['#ff6b5e', 90], ['#7cc8ff', 190], ['#a6d94e', 290], ['#ff9ec7', 520], ['#b49bff', 620], ['#ff9d4d', 720]]; return `<rect width="800" height="500" fill="#ffe9a8"/><rect y="370" width="800" height="130" fill="#b5764a"/><path d="M0 370H800" stroke="${INK}" stroke-width="6"/><path d="M0 60H800" stroke="${INK}" stroke-width="12"/>${g.map(p => `<path d="M${p[1]} 60q0 22 0 24l-44 28h88z" fill="none" stroke="${INK}" stroke-width="5"/><path d="M${p[1] - 44} 112L${p[1] - 64} 150H${p[1] - 40}V290H${p[1] + 40}V150H${p[1] + 64}L${p[1] + 44} 112Z" fill="${p[0]}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>`).join('')}` ; } },
  { id: 'swamp', label: 'Moon swamp', s: 1, wall: '#14594f', draw: () => `<rect width="800" height="500" fill="#14594f"/><circle cx="620" cy="100" r="62" fill="#ffe9a8" stroke="${INK}" stroke-width="5"/><path d="M0 250Q100 170 220 240T470 230T800 240V360H0Z" fill="#0d4640"/><rect y="340" width="800" height="160" fill="#2f9c82"/><path d="M0 340H800" stroke="${INK}" stroke-width="6"/>${[[110, 430], [660, 450], [590, 390], [190, 385]].map(p => `<path d="M${p[0]} ${p[1]}m-56 0a56 22 0 1 0 8 -16L${p[0]} ${p[1]}Z" fill="#a6d94e" stroke="${INK}" stroke-width="5"/>`).join('')}${[40, 72, 740, 770].map(x => `<path d="M${x} 345V190" stroke="${INK}" stroke-width="7"/><rect x="${x - 9}" y="170" width="18" height="62" rx="9" fill="#a86a3c" stroke="${INK}" stroke-width="5"/>`).join('')}` },
  { id: 'moon', label: 'Outer space', s: 0, wall: '#1a1d5a', draw: () => { let st = ''; for (let i = 0; i < 46; i++) st += `<circle cx="${(i * 173) % 800}" cy="${(i * 97) % 330}" r="${1.5 + i % 3}" fill="#fffdf4"/>`; return `<rect width="800" height="500" fill="#1a1d5a"/>${st}<circle cx="130" cy="110" r="52" fill="#ff9d4d" stroke="${INK}" stroke-width="5"/><ellipse cx="130" cy="110" rx="92" ry="17" fill="none" stroke="#ffe066" stroke-width="8"/><path d="M0 360Q200 325 400 350T800 345V500H0Z" fill="#c9c6dd" stroke="${INK}" stroke-width="6"/>${[[120, 430, 54], [650, 410, 42], [720, 470, 30], [260, 480, 26]].map(p => `<ellipse cx="${p[0]}" cy="${p[1]}" rx="${p[2]}" ry="${p[2] * .34}" fill="#9d99ba" stroke="${INK}" stroke-width="5"/>`).join('')}`; } },
];
const LISTS = { pattern: PATTERNS, eyes: EYES, mouth: MOUTHS, horns: HORNS, hat: HATS, outfit: OUTFITS, shoes: SHOES, toy: TOYS, back: BACKS, room: ROOMS };
const find = (key, id) => LISTS[key].find(i => i.id === id) || LISTS[key][0];

/* ---------- Drawing ---------- */
let clipCount = 0;
function monsterSVG(st) {
  const b = BODIES[st.body], c = st.fur, id = 'c' + (++clipCount);
  const outfit = find('outfit', st.outfit), toy = st.toy !== 'none';
  const skin = outfit.sleeve || c;
  const ax = b.arm, ay = b.armY;
  const hand = [400 - ax + 36, ay - 34];
  const leftArm = `<ellipse cx="${ax - 6}" cy="${ay + 12}" rx="20" ry="35" fill="${skin}" ${S} transform="rotate(20 ${ax - 6} ${ay + 12})"/><circle cx="${ax - 19}" cy="${ay + 41}" r="14" fill="${c}" ${S}/>`;
  const rightArm = toy
    ? `<ellipse cx="${400 - ax + 16}" cy="${ay - 6}" rx="20" ry="37" fill="${skin}" ${S} transform="rotate(40 ${400 - ax + 16} ${ay - 6})"/><circle cx="${hand[0]}" cy="${hand[1]}" r="15" fill="${c}" ${S}/>`
    : `<ellipse cx="${400 - ax + 6}" cy="${ay + 12}" rx="20" ry="35" fill="${skin}" ${S} transform="rotate(-20 ${400 - ax + 6} ${ay + 12})"/><circle cx="${400 - ax + 19}" cy="${ay + 41}" r="14" fill="${c}" ${S}/>`;
  const shoe = find('shoes', st.shoes);
  return `<clipPath id="${id}"><path d="${b.d}"/></clipPath>
    ${find('back', st.back).draw(b, c)}
    ${find('horns', st.horns).draw(b, c)}
    <path d="${b.d}" fill="${c}"/>
    <g clip-path="url(#${id})">${find('pattern', st.pattern).draw(b, c)}${outfit.draw(b)}</g>
    <path d="${b.d}" ${LINE}/>
    ${shoe.draw(200 - b.foot, b.hem + 2, c)}${shoe.draw(200 + b.foot, b.hem + 2, c)}
    ${outfit.over ? outfit.over(b) : ''}
    <ellipse cx="${200 - b.gap - 20}" cy="${b.mouth - 2}" rx="17" ry="10" fill="#ff7fa8" opacity=".55"/>
    <ellipse cx="${200 + b.gap + 20}" cy="${b.mouth - 2}" rx="17" ry="10" fill="#ff7fa8" opacity=".55"/>
    ${find('eyes', st.eyes).draw(b, c)}
    ${find('mouth', st.mouth).draw(b)}
    <g transform="translate(200 ${b.top + 14})">${find('hat', st.hat).draw()}</g>
    ${leftArm}
    <g transform="translate(${hand[0]} ${hand[1]})">${find('toy', st.toy).draw()}</g>
    ${rightArm}`;
}
function cropFor(key, b) {
  if (key === 'eyes') return `70 ${b.eye - 92} 260 200`;
  if (key === 'mouth') return `100 ${b.mouth - 50} 200 130`;
  if (key === 'horns' || key === 'hat') return `20 ${b.top - 140} 360 300`;
  if (key === 'shoes') return `70 ${b.hem - 66} 260 124`;
  if (key === 'outfit') return `30 ${b.neck - 60} 340 ${b.hem - b.neck + 96}`;
  return '-40 -60 480 490';
}

/* ---------- State ---------- */
const DEFAULT = { body: 'gloop', fur: FURS[0], pattern: 'belly', eyes: 'big', mouth: 'paci', horns: 'nubs', hat: 'bonnet', outfit: 'overalls', shoes: 'booties', toy: 'rattle', back: 'none', room: 'nursery', name: 'Baby Gloop' };
const KEY = 'baby-monster-closet-v1';
let state = { ...DEFAULT }, tab = 'body', soundOn = true;
try {
  const saved = JSON.parse(localStorage.getItem(KEY));
  if (saved && BODIES[saved.body] && FURS.includes(saved.fur)) state = { ...DEFAULT, ...saved };
} catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

const TABS = [['body', 'Monster'], ['eyes', 'Eyes'], ['mouth', 'Mouth'], ['horns', 'Horns'], ['hat', 'Hats'], ['outfit', 'Clothes'], ['shoes', 'Shoes'], ['toy', 'Toys'], ['back', 'Back'], ['room', 'Room']];
const SYL1 = ['Bib', 'Moo', 'Gub', 'Snor', 'Wib', 'Pum', 'Fuzz', 'Bloop', 'Grum', 'Noo', 'Squish', 'Dribb'];
const SYL2 = ['ble', 'kins', 'lump', 'zle', 'bug', 'lette', 'wump', 'snout', 'y', 'ums', 'gob'];
const SNACKS = ['left socks', 'crayons', 'night-lights', 'dust bunnies', 'lost mittens', 'bedtime stories', 'jelly shoes', 'the last cookie'];
const BABBLE = ['Gaa!', 'Blorp!', 'Mine!', 'Rawr (tiny)', 'Bleh!', 'Hee hee!', 'Grrgoo!', 'Snorf!', 'Mama?', 'Boo! Boo!', 'Pretty!', 'Nom nom'];
const TICKLE = ['Hee hee hee!', 'Tickles!', 'Again!', 'Eep!', 'Gigglegrr!'];
const pick = a => a[Math.floor(Math.random() * a.length)];
const randName = () => 'Baby ' + pick(SYL1) + pick(SYL2);
const hash = s => [...s].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) >>> 0, 7);

/* ---------- Render ---------- */
const $ = id => document.getElementById(id);
const critter = $('critter');
function draw() {
  critter.innerHTML = monsterSVG(state);
  $('room').innerHTML = find('room', state.room).draw();
  const total = Object.keys(LISTS).reduce((n, k) => n + find(k, state[k]).s, 0);
  const pct = Math.max(4, Math.min(96, 50 + total * 4.5));
  $('pin').style.left = pct + '%';
  $('verdict').textContent = pct < 22 ? 'Extra snuggly' : pct < 44 ? 'Snuggly' : pct < 60 ? 'Mischievous' : pct < 80 ? 'A little spooky' : 'Terrifying, for a baby';
  const h = hash(state.name || 'x');
  $('facts').textContent = `Born under a bed. Weighs ${5 + h % 6} lb ${h % 16} oz of ${find('pattern', state.pattern).id === 'none' ? 'fuzz' : 'fluff'}. Favorite snack: ${SNACKS[h % SNACKS.length]}.`;
}
function tile(label, on, inner, click) {
  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'tile';
  btn.setAttribute('aria-pressed', on);
  btn.innerHTML = inner + `<span>${label}</span>`;
  btn.onclick = click;
  return btn;
}
function drawShelf() {
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.k === tab));
  const shelf = $('shelf'), top = shelf.scrollTop;
  shelf.innerHTML = '';
  const section = (title, nodes, cls = 'grid') => {
    if (title) { const h = document.createElement('h2'); h.textContent = title; shelf.append(h); }
    const g = document.createElement('div'); g.className = cls; g.append(...nodes); shelf.append(g);
  };
  const thumb = (st, box) => `<svg class="thumb" viewBox="${box}" aria-hidden="true">${monsterSVG(st)}</svg>`;
  if (tab === 'body') {
    section('Pick your baby', Object.keys(BODIES).map(k => tile(BODIES[k].label, state.body === k,
      thumb({ ...DEFAULT, ...bare(state), body: k }, '-40 -60 480 490'), () => choose('body', k))));
    section('Fur color', FURS.map((c, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'swatch'; b.style.setProperty('--c', c);
      b.title = FUR_NAMES[i]; b.setAttribute('aria-label', FUR_NAMES[i]);
      b.setAttribute('aria-pressed', state.fur === c); b.onclick = () => choose('fur', c);
      return b;
    }), 'swatches');
    section('Fur pattern', PATTERNS.map(p => tile(p.label, state.pattern === p.id,
      thumb({ ...bare(state), body: state.body, fur: state.fur, pattern: p.id, eyes: state.eyes, mouth: state.mouth }, '-40 -60 480 490'), () => choose('pattern', p.id))));
  } else if (tab === 'room') {
    section('', ROOMS.map(r => tile(r.label, state.room === r.id,
      `<svg class="thumb" viewBox="200 0 400 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${r.draw()}</svg>`, () => choose('room', r.id))));
  } else {
    const b = BODIES[state.body];
    section('', LISTS[tab].map(it => tile(it.label, state[tab] === it.id,
      thumb({ ...state, [tab]: it.id }, cropFor(tab, b)), () => choose(tab, it.id))));
  }
  shelf.scrollTop = top;
}
const bare = st => ({ ...st, pattern: st.pattern, horns: 'none', hat: 'none', outfit: 'none', shoes: 'none', toy: 'none', back: 'none' });

function react(cls, words) {
  critter.classList.remove('hop', 'tickle');
  void critter.getBoundingClientRect();
  critter.classList.add(cls);
  $('bubble').textContent = words;
}
critter.addEventListener('animationend', () => critter.classList.remove('hop', 'tickle'));
function choose(key, val) {
  state[key] = val;
  if (key === 'body' && /^Baby (Gloop|Tuft|Noodle|Chunk|Drip)$/.test(state.name)) { state.name = 'Baby ' + BODIES[val].label; $('name').value = state.name; }
  save(); draw(); drawShelf(); react('hop', pick(BABBLE)); squeak();
}

/* ---------- Sound (starts after the first tap) ---------- */
let ctx;
function tone(from, to, dur, type = 'sine', when = 0, vol = .13) {
  if (!soundOn) return;
  try {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + when;
    o.type = type; o.frequency.setValueAtTime(from, t); o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const squeak = () => { const f = 380 + Math.random() * 260; tone(f, f * 1.9, .14, 'triangle'); };
const giggle = () => [0, .11, .22, .33].forEach((w, i) => tone(620 + i * 90, 900 + i * 90, .09, 'triangle', w));

/* ---------- Controls ---------- */
TABS.forEach(([k, label]) => {
  const t = document.createElement('button');
  t.type = 'button'; t.className = 'tab'; t.textContent = label; t.dataset.k = k;
  t.setAttribute('role', 'tab');
  t.onclick = () => { tab = k; $('shelf').scrollTop = 0; drawShelf(); };
  $('tabs').append(t);
});
critter.addEventListener('click', e => {
  react('tickle', pick(TICKLE)); giggle();
  const r = $('stage').getBoundingClientRect(), h = document.createElement('span');
  h.className = 'heart'; h.textContent = '♥';
  h.style.left = (e.clientX - r.left) + 'px'; h.style.top = (e.clientY - r.top - 14) + 'px';
  $('stage').append(h); setTimeout(() => h.remove(), 1000);
});
$('surprise').onclick = () => {
  state.body = pick(Object.keys(BODIES)); state.fur = pick(FURS);
  Object.keys(LISTS).forEach(k => state[k] = pick(LISTS[k]).id);
  state.name = randName(); $('name').value = state.name;
  save(); draw(); drawShelf(); react('hop', pick(BABBLE)); tone(300, 900, .28, 'triangle');
};
$('reset').onclick = () => {
  ['horns', 'hat', 'outfit', 'shoes', 'toy', 'back'].forEach(k => state[k] = 'none');
  state.mouth = 'smile';
  save(); draw(); drawShelf(); react('hop', 'Nakey!'); tone(700, 260, .22, 'triangle');
};
$('rename').onclick = () => { state.name = randName(); $('name').value = state.name; save(); draw(); squeak(); };
$('name').oninput = e => { state.name = e.target.value; save(); draw(); };
$('sound').onclick = e => {
  soundOn = !soundOn;
  e.target.textContent = soundOn ? 'Sound on' : 'Sound off';
  e.target.setAttribute('aria-pressed', soundOn);
};

/* ---------- Home page and the #closet link ---------- */
const HERO = { body: 'chunk', fur: '#ff9d4d', pattern: 'spots', eyes: 'cyclops', mouth: 'fang', horns: 'uni', hat: 'bow', outfit: 'bones', shoes: 'bunny', toy: 'rattle', back: 'tail' };
function route() {
  const inCloset = location.hash === '#closet';
  $('home').hidden = inCloset;
  $('app').hidden = !inCloset;
  if (!inCloset) $('home-critter').innerHTML = monsterSVG(HERO);
}
$('door').addEventListener('click', e => {
  e.preventDefault();
  $('home-critter').classList.add('hop');
  giggle();
  setTimeout(() => {
    $('home-critter').classList.remove('hop');
    location.hash = 'closet';
    route();
  }, 450);
});
$('back').addEventListener('click', e => {
  e.preventDefault();
  location.hash = 'home';
  route();
});
window.addEventListener('hashchange', route);

$('name').value = state.name;
draw(); drawShelf(); route();
})();
</script>
</body>
</html>
