<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Dolly's Playroom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Grandstander:wght@500;700;800&display=swap">
<style>
/* Layout: a die-cut sticker monster stands in its room on the left; a butter-yellow wardrobe of live previews fills the right. */
:root {
  --closet: #0d6c66;
  --closet-deep: #0a5752;
  --drawer: #ffd84d;
  --drawer-deep: #f4bb1f;
  --paper: #fffdf4;
  --ink: #2a1a4a;
  --pop: #ff4f8b;
  --spook: #6b3fd4;
  --display: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Grandstander", "Trebuchet MS", "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--closet);
  background-image: radial-gradient(var(--closet-deep) 14%, transparent 15%);
  background-size: 26px 26px;
  color: var(--ink);
  font-family: var(--body);
  font-weight: 700;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--pop); outline-offset: 2px; }

.app {
  height: 100%;
  min-height: 620px;
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
  gap: 16px;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1280px;
  margin-inline: auto;
}
.left, .right { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 10px; }

header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
h1 {
  margin: 0;
  font: 400 clamp(24px, 3.4vw, 40px)/1 var(--display);
  color: var(--drawer);
  text-shadow: 3px 3px 0 var(--ink);
  letter-spacing: .01em;
  text-wrap: balance;
}
.sound {
  flex: none; background: var(--paper); border: 3px solid var(--ink); border-radius: 999px;
  padding: 7px 20px; box-shadow: 3px 4px 0 var(--ink); line-height: 0;
}

.stage {
  position: relative; flex: 1; min-height: 0; overflow: hidden;
  border: 4px solid var(--ink); border-radius: 26px; box-shadow: 4px 6px 0 var(--ink);
  background: var(--ink);
}
.room, .monster { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.monster { padding: 6px; overflow: visible; }
#critter { cursor: pointer; transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 3.2s ease-in-out infinite; }
#critter.hop { animation: hop .5s ease; }
#critter.tickle { animation: tickle .7s ease; }
@keyframes breathe { 50% { transform: scale(1.012, .985); } }
@keyframes hop {
  0% { transform: scale(1.1, .88); } 40% { transform: translateY(-34px) scale(.95, 1.06); }
  75% { transform: scale(1.08, .9); } 100% { transform: none; }
}
@keyframes tickle {
  0%, 100% { transform: none; } 20% { transform: rotate(-5deg); } 40% { transform: rotate(5deg); }
  60% { transform: rotate(-4deg); } 80% { transform: rotate(3deg); }
}
.lid { transform-box: fill-box; transform-origin: 50% 0; transform: scaleY(0); animation: blink 5.3s infinite; }
.thumb .lid { animation: none; }
@keyframes blink { 0%, 95%, 100% { transform: scaleY(0); } 97.5% { transform: scaleY(1); } }

.bubble {
  position: absolute; top: 12px; left: 12px; max-width: 46%;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 18px 18px 18px 4px;
  padding: 7px 14px 4px; font: 400 clamp(16px, 2vw, 21px)/1.15 var(--display);
  box-shadow: 2px 3px 0 var(--ink);
}
.heart { position: absolute; font-size: 24px; color: var(--pop); pointer-events: none; animation: float 1s ease-out forwards; }
@keyframes float { to { transform: translateY(-90px) rotate(18deg); opacity: 0; } }

.card {
  background: var(--paper); border: 4px solid var(--ink); border-radius: 16px;
  padding: 8px 12px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 4px 16px; align-items: center;
  box-shadow: 4px 5px 0 var(--ink);
}
.card-name { display: flex; align-items: center; gap: 6px; min-width: 0; }
.eyebrow { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--pop); font-weight: 800; }
#name {
  width: 100%; min-width: 0; border: 0; border-bottom: 3px dashed var(--ink); background: none;
  font: 400 22px/1.1 var(--display); padding: 2px 0 0;
}
.reroll { flex: none; background: var(--drawer); border: 3px solid var(--ink); border-radius: 10px; padding: 4px 8px 1px; font-size: 13px; }
.facts { grid-column: 1 / -1; margin: 0; font-size: 14px; font-weight: 500; line-height: 1.3; }
.meter-row { display: flex; justify-content: space-between; font-size: 13px; }
.meter { position: relative; height: 14px; border: 3px solid var(--ink); border-radius: 99px; background: linear-gradient(90deg, #ffb3cf, #cdb7ff, var(--spook)); margin-top: 2px; }
#pin, .pin { position: absolute; top: -6px; width: 16px; height: 20px; margin-left: -8px; background: var(--paper); border: 3px solid var(--ink); border-radius: 7px; transition: left .3s ease; }
#verdict { font-size: 14px; text-align: center; margin-top: 3px; }

.wardrobe {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  background: var(--drawer); border: 4px solid var(--ink); border-radius: 26px; box-shadow: 4px 6px 0 var(--ink); overflow: hidden;
}
.tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; padding: 10px 10px 8px; background: var(--drawer-deep); border-bottom: 4px solid var(--ink); }
.tab { border: 3px solid var(--ink); border-radius: 11px; background: var(--paper); padding: 6px 2px 3px; font-size: 14px; }
.tab[aria-selected="true"] { background: var(--pop); color: var(--paper); }
.shelf { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.shelf h2 { margin: 2px 0 0; font: 400 19px/1 var(--display); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 9px; }
.tile {
  display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 4px 4px 3px; min-width: 0;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 15px; font-size: 13px; line-height: 1.1;
  transition: transform .1s;
}
.tile:hover { transform: translateY(-2px) rotate(-1deg); }
.tile[aria-pressed="true"] { background: #ffd3e3; box-shadow: 0 0 0 3px var(--pop); }
.thumb { width: 100%; aspect-ratio: 1; display: block; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--ink); background: var(--c); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--paper), 0 0 0 6px var(--pop); }
.actions { display: flex; gap: 8px; padding: 9px 10px; background: var(--drawer-deep); border-top: 4px solid var(--ink); }
.actions button { flex: 1; border: 3px solid var(--ink); border-radius: 13px; padding: 9px 6px 6px; font: 400 17px/1 var(--display); box-shadow: 2px 3px 0 var(--ink); }
#surprise { background: var(--pop); color: var(--paper); }
#reset { background: var(--paper); }
.actions button:active, .sound:active { transform: translate(2px, 2px); box-shadow: none; }

#snap {
  position: absolute; top: 12px; right: 12px; width: 84px; height: 84px; padding: 12px; border-radius: 50%;
  background: var(--pop); border: 4px solid var(--ink); box-shadow: 3px 4px 0 var(--ink);
}
#snap svg { display: block; width: 100%; height: 100%; }
#snap:active { transform: translate(2px, 3px); box-shadow: none; }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.flash.go { animation: flash .45s ease-out; }
@keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }
.album-link {
  margin-top: 26px; background: var(--drawer); color: var(--ink); border: 4px solid var(--ink); border-radius: 16px;
  padding: 11px 26px 7px; font: 400 22px/1 var(--display); text-decoration: none; box-shadow: 3px 4px 0 var(--ink);
}
.album {
  min-height: 100%; max-width: 1180px; margin-inline: auto; display: flex; flex-direction: column; gap: 22px;
  padding-block: 16px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.album-title { margin: 0; font: 400 clamp(26px, 4.4vw, 46px)/1.05 var(--display); color: var(--drawer); text-shadow: 3px 3px 0 var(--ink); }
.album-title span { color: #ffb3cf; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 26px 22px; }
.polaroid {
  position: relative; margin: 0; background: var(--paper); border: 3px solid var(--ink); padding: 10px 10px 8px; min-width: 0;
  box-shadow: 4px 6px 0 var(--ink); transform: rotate(var(--tilt, 0deg));
}
.polaroid svg { display: block; width: 100%; aspect-ratio: 1; border: 3px solid var(--ink); background: var(--ink); }
.polaroid .lid { animation: none; }
.polaroid figcaption { padding-top: 8px; text-align: center; }
.polaroid b { display: block; font: 400 19px/1.1 var(--display); overflow-wrap: anywhere; }
.polaroid small { font-size: 13px; font-weight: 500; }
.remove {
  position: absolute; top: -12px; right: -10px; background: var(--paper); border: 3px solid var(--ink); border-radius: 12px;
  padding: 4px 9px 1px; font-size: 13px;
}
.remove.sure { background: var(--pop); color: var(--paper); }
.empty { grid-column: 1 / -1; justify-self: center; width: min(100%, 280px); }
.empty .blank { aspect-ratio: 1; border: 3px dashed var(--ink); display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; font-size: 17px; }
.nursery {
  height: 100%; min-height: 640px; max-width: 980px; margin-inline: auto; display: flex; flex-direction: column; gap: 12px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.nursery .stage { flex: 1; min-height: 260px; }
#n-critter { cursor: pointer; transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 3.2s ease-in-out infinite; }
#n-critter.hop { animation: hop .5s ease; }
#n-critter.tickle { animation: tickle .7s ease; }
.n-bubble { display: flex; align-items: center; gap: 8px; min-height: 48px; }
.n-bubble svg { width: 38px; height: 38px; flex: none; }
.night { position: absolute; inset: 0; background: #14103a; opacity: 0; pointer-events: none; transition: opacity .8s; }
.night.on { opacity: .62; }
.care { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.care button {
  display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; padding: 8px 6px;
  background: var(--drawer); border: 4px solid var(--ink); border-radius: 20px; box-shadow: 3px 4px 0 var(--ink);
  font: 400 clamp(15px, 2.4vw, 22px)/1 var(--display);
}
.care button:active { transform: translate(2px, 3px); box-shadow: none; }
.care svg { width: clamp(44px, 9vh, 72px); height: clamp(44px, 9vh, 72px); }
.care .need { background: var(--pop); color: var(--paper); animation: nudge 1s ease-in-out infinite; }
@keyframes nudge { 50% { transform: scale(1.05) rotate(-2deg); } }
.bar { width: 100%; height: 13px; border: 3px solid var(--ink); border-radius: 99px; background: var(--paper); overflow: hidden; margin-top: 3px; }
.bar i { display: block; height: 100%; background: #62d39b; transition: width .4s; }
.tray {
  position: absolute; left: 10px; right: 10px; bottom: 10px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;
  background: var(--paper); border: 4px solid var(--ink); border-radius: 20px; padding: 8px;
}
.tray button { background: none; border: 0; padding: 0; font-size: 14px; min-width: 0; }
.tray svg { display: block; width: 100%; max-height: 74px; margin-inline: auto; }
.fly { position: absolute; left: 50%; bottom: 14%; width: 74px; height: 74px; margin-left: -37px; pointer-events: none; animation: fly .55s ease-in forwards; }
@keyframes fly { to { bottom: 44%; transform: scale(.45); opacity: .85; } }
.spark { position: absolute; font-size: 30px; color: var(--paper); text-shadow: 0 0 4px var(--pop); pointer-events: none; animation: float 1s ease-out forwards; }
[data-i] svg, .tab svg { display: block; }
.sound svg { width: 46px; height: 46px; margin-inline: auto; }
#to-nursery:hover svg, #to-nursery:active svg { animation: tickle .5s ease; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.tab svg { width: 34px; height: 34px; }
.reroll svg { width: 30px; height: 30px; }
.reroll { padding: 3px 5px !important; }
.actions button { display: flex; align-items: center; justify-content: center; gap: 7px; }
.actions svg { width: 32px; height: 32px; }
.album-link { display: flex; align-items: center; gap: 8px; }
.album-link svg { width: 36px; height: 36px; }
.polaroid[role="button"] { cursor: zoom-in; }
.zoom {
  overflow-y: auto;
  position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; cursor: zoom-out;
  background: #2a1a4ae0;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
#zoom-photo { width: min(100%, 54vh, 520px); max-height: 100%; display: flex; flex-direction: column; gap: 14px; }
.card.zoom-card { grid-template-columns: minmax(0, 1fr); text-align: left; cursor: default; padding: 10px 14px; }
.zoom-card .eyebrow, .zoom-card .z-verdict { display: block; }
.zoom-card .z-verdict { font-size: 15px; text-align: center; margin-top: 3px; }
.zoom-card .facts { display: block; grid-column: auto; font-size: 15px; }
#zoom-photo .polaroid { --tilt: 0deg; cursor: zoom-out; padding: 16px 16px 12px; animation: pop .22s ease-out; }
#zoom-photo .polaroid b { font-size: clamp(24px, 4.5vh, 36px); }
#zoom-photo .polaroid small { font-size: 16px; }
@keyframes pop { from { transform: scale(.7); } }
.zoom-close {
  position: absolute; top: max(14px, env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px));
  width: 60px; height: 60px; border-radius: 50%; background: var(--pop); color: var(--paper);
  border: 4px solid var(--ink); font-size: 26px; font-weight: 800; box-shadow: 3px 4px 0 var(--ink);
}
.head-btns { flex: none; display: flex; gap: 8px; }
a.sound { color: var(--ink); text-decoration: none; }

.home {
  min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: clamp(14px, 3vh, 26px); text-align: center;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.home-title {
  margin: 0; font: 400 clamp(32px, 6.5vw, 62px)/1.05 var(--display); color: var(--drawer);
  text-shadow: 3px 4px 0 var(--ink); text-wrap: balance;
}
.home-title span { color: #ffb3cf; }
.doors {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr) minmax(0, 1fr); align-items: end;
  gap: clamp(32px, 4vw, 48px); width: min(100%, 104vh, 980px);
}
.door.soon {
  background: repeating-linear-gradient(90deg, var(--c) 0 26px, var(--c2) 26px 30px);
  box-shadow: 0 0 0 8px var(--drawer), 0 0 0 12px var(--ink), 6px 9px 0 12px var(--ink);
}
.door.soon:hover { transform: none; }
.door.small {
  background: linear-gradient(#ffc2d6 0 74%, #d59a68 74%);
  box-shadow: 0 0 0 8px var(--drawer), 0 0 0 12px var(--ink), 6px 9px 0 12px var(--ink);
}
.door.small .door-label { font-size: clamp(13px, 1.7vw, 19px); padding: 7px 11px 3px; bottom: -20px; }
.door.soon::after {
  content: ""; position: absolute; right: 12%; top: 54%; width: 22px; height: 22px; border-radius: 50%;
  background: var(--drawer); border: 4px solid var(--ink);
}
.door.soon .door-label { background: var(--paper); color: var(--ink); font-size: 19px; padding: 7px 16px 3px; bottom: -20px; }
.door {
  position: relative; display: block; width: 100%; aspect-ratio: 5 / 6;
  background:
    radial-gradient(circle at 18% 30%, #fffdf4 0 3px, transparent 4px),
    radial-gradient(circle at 80% 22%, #fffdf4 0 4px, transparent 5px),
    radial-gradient(circle at 30% 14%, #fffdf4 0 2px, transparent 3px),
    radial-gradient(circle at 62% 8%, #fffdf4 0 3px, transparent 4px),
    radial-gradient(circle at 90% 46%, #fffdf4 0 2px, transparent 3px),
    radial-gradient(circle at 8% 52%, #fffdf4 0 3px, transparent 4px),
    linear-gradient(#1a1d5a 0 74%, #c9c6dd 74%);
  border: 5px solid var(--ink); border-radius: 999px 999px 30px 30px; box-shadow: 0 0 0 12px var(--drawer), 0 0 0 16px var(--ink), 8px 12px 0 16px var(--ink);
  color: var(--ink); text-decoration: none; margin-block: 16px;
  transition: transform .12s;
}
.door:hover { transform: scale(1.02) rotate(-1deg); }
.home-monster { position: absolute; left: 5%; right: 5%; bottom: 5%; width: 90%; height: auto; overflow: visible; }
#home-critter { transform-box: fill-box; transform-origin: 50% 100%; animation: wave 1.8s ease-in-out infinite; }
#home-critter.hop { animation: hop .5s ease; }
@keyframes wave { 0%, 100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg) translateY(-6px); } }
.door-bubble {
  position: absolute; top: 15%; right: -3%; background: var(--paper); border: 3px solid var(--ink); border-radius: 18px 18px 4px 18px;
  padding: 6px 12px 3px; font: 400 20px/1.1 var(--display); box-shadow: 2px 3px 0 var(--ink);
}
.door-label {
  position: absolute; left: 50%; bottom: -24px; transform: translateX(-50%);
  background: var(--pop); color: var(--paper); border: 4px solid var(--ink); border-radius: 18px;
  padding: 9px 18px 5px; font: 400 clamp(19px, 2.3vw, 26px)/1 var(--display); box-shadow: 3px 4px 0 var(--ink); white-space: nowrap;
}

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 47fr) minmax(0, 53fr); padding-block: 8px; gap: 12px; min-height: 740px; }
  .left { gap: 7px; }
  h1 { font-size: 19px; }
  .sound { flex: 1 1 0; padding: 5px 4px; text-align: center; }
  .tab span:last-child { display: none; }
  .tab { padding: 4px 2px; }
  .tab svg { width: 36px; height: 36px; }
  .head-btns { gap: 7px; width: 100%; }
  #snap { width: 68px; height: 68px; padding: 9px; top: 8px; right: 8px; }
  .actions { gap: 6px; }
  .actions button { font-size: 15px; padding-inline: 2px; }
  .photos { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 18px; }
  .doors { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); width: min(100%, 340px); }
  .door.main { grid-column: 1 / -1; grid-row: 1; width: 72%; margin-inline: auto; }
  .facts { display: none; }
  .card { padding: 5px 9px; }
  #name { font-size: 18px; }
  .eyebrow, #verdict, .wide { display: none; }
  .card { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 4px 10px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(82px, 1fr)); }
  .tab { font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  #critter, #critter.hop, #critter.tickle, #n-critter, #n-critter.hop, #n-critter.tickle, .care .need, .fly, #home-critter, #home-critter.hop, .lid, .heart { animation: none; }
  .tile, #pin { transition: none; }
  #zoom-photo .polaroid { animation: none; }
  .flash.go { animation: none; }
}
</style>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="sticker-photo" x="-15%" y="-15%" width="130%" height="130%">
    <feMorphology in="SourceAlpha" operator="dilate" radius="6" result="fat"/>
    <feFlood flood-color="#fffdf4"/>
    <feComposite in2="fat" operator="in" result="edge"/>
    <feMerge><feMergeNode in="edge"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs></svg>

<section class="album" id="album" aria-label="Photo album" hidden>
  <header>
    <h2 class="album-title"><span>Dolly's</span> Photo Album</h2>
    <div class="head-btns">
      <a class="sound" href="#home" data-i="home" aria-label="Home" title="Home"></a>
      <a class="sound" href="#closet" data-i="closet" aria-label="Closet" title="Closet"></a>
    </div>
  </header>
  <div class="photos" id="photos"></div>
  <div class="zoom" id="zoom" role="dialog" aria-label="Enlarged photo" hidden>
    <button class="zoom-close" id="zoom-close" type="button" aria-label="Close photo" title="Close photo">✕</button>
    <div id="zoom-photo"></div>
  </div>
</section>

<section class="nursery" id="nursery" aria-label="Monster nursery" hidden>
  <header>
    <h2 class="album-title" id="n-title"></h2>
    <div class="head-btns">
      <a class="sound" href="#home" data-i="home" aria-label="Home" title="Home"></a>
      <a class="sound" href="#closet" data-i="closet" aria-label="Closet" title="Closet"></a>

function shade(hex, f) {

let ctx;
/* Phones keep audio asleep until a tap wakes it. This also lets sound play with the iPhone ringer switch off, on newer iOS. */
try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
function wakeAudio() {
  if (!soundOn) return;
  try {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state !== 'running') {
      ctx.resume();
      const src = ctx.createBufferSource();
      src.buffer = ctx.createBuffer(1, 1, 22050);
      src.connect(ctx.destination); src.start(0);
    }
  } catch (e) {}
}

function tone(from, to, dur, type = 'sine', when = 0, vol = .13) {
  if (!soundOn) return;

    o.type = type; o.frequency.setValueAtTime(from, t); o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}

  nReact('hop'); done();
}
Object.keys(NEEDS).forEach(k => {
  const n = NEEDS[k], b = document.createElement('button');
  b.type = 'button'; b.id = 'care-' + k;
  b.innerHTML = `${ICON[n.icon]}<span>${n.label}</span><div class="bar"><i></i></div>`;
  b.onclick = () => { if (asleep && k !== 'sleep') return; if (!busy) ACT[k](); };
  $('care').append(b);
});
FOODS.forEach(([key, label]) => {
  const b = document.createElement('button');
  b.type = 'button'; b.innerHTML = `${ICON[key]}${label}`;
  b.onclick = () => { if (!busy) eat(key); };
  $('n-tray').append(b);
});
nC.addEventListener('click', () => {
  if (asleep) return wake();
  if (busy) return;
  nReact('tickle'); giggle(); say(pick(TICKLE));
});
function enterNursery() {
  $('n-title').textContent = (state.name || 'Baby Monster') + "'s Nursery";
  $('n-room').innerHTML = find('room', state.room).draw();
  $('n-tray').hidden = true;
  lastMode = ''; nStatus();
}
setInterval(() => {
  if ($('nursery').hidden || busy || asleep) return;
  Object.keys(NEEDS).forEach(k => care[k] = Math.max(0, care[k] - NEEDS[k].rate));
  nStatus();
  saveCare();
}, 1000);

$('name').value = state.name;
draw(); drawShelf(); route();
})();
</script>
</body>
</html>
